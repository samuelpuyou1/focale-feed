name: Daily feed

on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour à 5 h UTC (6 h ou 7 h à Paris)
  workflow_dispatch:       # bouton « Run workflow »
  push:                    # relance quand le script ou les sources changent
    branches: [main]
    paths: ["build_feed.py", "sources.json", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Générer les cartes
        id: build
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_feed.py
      - name: Publier (cartes + rapport, même en cas d'échec)
        run: |
          git config user.name "focale-bot"
          git config user.email "focale-bot@users.noreply.github.com"
          git add docs/cards.json docs/status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Cartes du $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Résultat
        if: steps.build.outcome == 'failure'
        run: |
          cat docs/status.json || true
          exit 1
