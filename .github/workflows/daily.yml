name: Daily feed

on:
  schedule:
    # Le quota gratuit de Gemini repart à minuit, heure du Pacifique (8 h ou 9 h UTC) : on passe juste après.
    - cron: "15 9 * * *"
    # Rattrapage (surcharge, quota par minute) : ne fait rien si la journée a déjà ses cartes.
    - cron: "15 15 * * *"
  workflow_dispatch:       # bouton « Run workflow »
  # Pas de relance à chaque poussée : chaque lancement consomme le quota du jour.

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Générer les cartes
        id: build
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Lancement à la main : toujours exécuté, même si la journée a déjà ses cartes.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python build_feed.py
      - name: Publier (cartes + rapport, même en cas d'échec)
        run: |
          git config user.name "focale-bot"
          git config user.email "focale-bot@users.noreply.github.com"
          git add docs/cards.json docs/status.json docs/seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Cartes du $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Résultat
        if: steps.build.outcome == 'failure'
        run: |
          cat docs/status.json || true
          exit 1
