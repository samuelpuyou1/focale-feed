name: Daily feed

on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour à 5 h UTC (6 h ou 7 h à Paris)
  workflow_dispatch:       # bouton « Run workflow »

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Générer les cartes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_feed.py
      - name: Publier
        run: |
          if git diff --quiet docs/cards.json 2>/dev/null && git ls-files --error-unmatch docs/cards.json >/dev/null 2>&1; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "focale-bot"
          git config user.email "focale-bot@users.noreply.github.com"
          git add docs/cards.json
          git commit -m "Cartes du $(date -u +%Y-%m-%d)"
          git push
